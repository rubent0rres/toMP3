name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: win
            arch: x64
          - name: Mac Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
          - name: Mac Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Comprobar versión
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_TYPE==='tag'&&process.env.GITHUB_REF_NAME!=='v'+p.version)throw Error('La etiqueta debe coincidir con package.json');"
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run tools:setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generar instalador nativo
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - run: npm run test:package
      - name: Guardar instaladores verificados
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: work/package-check/

  publish:
    name: Publicar descargas
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Comprobar descargas y calcular SHA-256
        working-directory: installers
        run: |
          test -s toMP3-windows-x64.exe
          test -s toMP3-macos-arm64.dmg
          test -s toMP3-macos-x64.dmg
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - name: Preparar notas
        run: |
          cat > release-notes.md <<'EOF'
          Descarga videos de YouTube y Reels públicos de Facebook como **MP3** o **MP4**.

          Los MP4 se verifican y preparan con video H.264 y audio AAC-LC para facilitar su reproducción y edición. Las pistas que ya son compatibles se conservan sin volver a comprimirlas.

          | Tu equipo | Archivo |
          | --- | --- |
          | Windows de 64 bits | `toMP3-windows-x64.exe` |
          | Mac con Apple Silicon (M1 o posterior) | `toMP3-macos-arm64.dmg` |
          | Mac con procesador Intel | `toMP3-macos-x64.dmg` |

          En Windows, ejecuta el instalador. En Mac, abre el DMG y arrastra toMP3 a Aplicaciones. Las herramientas de descarga y conversión ya están incluidas.

          Los instaladores aún no tienen firma digital ni notarización; el sistema puede mostrar un aviso al abrirlos. Los archivos ZIP son una alternativa para Mac. `SHA256SUMS.txt` permite comprobar las descargas.

          Cada versión se compila y verifica en su sistema: apertura de la app, herramientas incluidas y conversión local a MP3 y MP4. La disponibilidad de un video depende de YouTube o Facebook.
          EOF
      - name: Subir y publicar versión completa
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if(!require('./release-state.json').isDraft)throw Error('La versión ya está publicada; usa una etiqueta nueva');"
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --title "toMP3 ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
